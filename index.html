<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Happy Mother's Day 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
  html,body{min-height:100vh;background:#fce8f0;}

  /* checkered background */
  #bg{position:fixed;inset:0;z-index:-1;
    background-image:linear-gradient(45deg,#f5b8ce 25%,transparent 25%),linear-gradient(-45deg,#f5b8ce 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f5b8ce 75%),linear-gradient(-45deg,transparent 75%,#f5b8ce 75%);
    background-size:36px 36px;background-position:0 0,0 18px,18px -18px,-18px 0;background-color:#fce8f0;}

  /* dot nav */
  #dots{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:100;}
  .dot{height:7px;border-radius:99px;background:#f0a0c0;transition:all .4s ease;}
  .dot.active{width:20px;background:#e8186d;}
  .dot.inactive{width:7px;}

  /* wrapper */
  #app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;}

  /* screen transitions */
  .screen{min-height:100vh;animation:sIn .45s cubic-bezier(.22,1,.36,1) both;}
  @keyframes sIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

  /* shared layout */
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:0 24px;text-align:center;}
  .card{background:white;border-radius:28px;padding:44px 28px;max-width:360px;width:100%;box-shadow:0 8px 40px #e8186d18;text-align:center;}

  /* gradient text */
  .grad-text{background:linear-gradient(135deg,#e8186d,#f06090);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

  /* button */
  .btn{background:linear-gradient(135deg,#e8186d,#f06090);color:white;border:none;border-radius:99px;padding:14px 36px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 5px 20px #e8186d44;transition:all .15s ease;font-family:'Poppins',sans-serif;}
  .btn:active{transform:scale(0.95);box-shadow:0 2px 8px #e8186d66;}

  /* fade-in utility */
  .fade{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease;}
  .fade.show{opacity:1;transform:translateY(0);}

  /* ── LANDING ── */
  #screen-landing h1{font-size:2.6rem;font-weight:900;margin-bottom:4px;}
  #landing-sub{color:#e8186d;font-size:.8rem;margin-bottom:4px;}
  #landing-cat{display:block;margin:0 auto;transition:transform .7s ease;}
  #landing-cat.bounce{transform:translateY(-7px);}
  #landing-p{color:#aaa;margin-bottom:28px;}

  /* ── RAINBOW ── */
  #rainbow-arcs path{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);}
  .arc-animate{animation:arcDraw .55s ease both;}
  @keyframes arcDraw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}

  /* ── MEMORY ── */
  #mem-line{stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset 1s ease;}
  #mem-line.drawn{stroke-dashoffset:0;}
  .mem-photo{border:3px solid #e8186d;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px #e8186d22;}
  .mem-emoji{height:160px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;}

  /* ── WHAT YOU MEAN ── */
  #whatyoumean-section{padding:16px;}
  #center-avatar{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:linear-gradient(135deg,#fdd6e8,#ffe4c4);border-radius:50%;width:120px;height:120px;
    display:flex;align-items:center;justify-content:center;font-size:3.5rem;
    box-shadow:0 0 30px #e8186d33;cursor:pointer;}
  .tag-chip{position:absolute;opacity:0;transform:scale(.5);
    transition:all .45s cubic-bezier(.34,1.56,.64,1);
    background:white;border-radius:99px;padding:7px 15px;font-size:.76rem;font-weight:700;
    color:#e8186d;box-shadow:0 4px 14px #e8186d18;white-space:nowrap;border:1.5px solid #fdd6e8;}
  .tag-chip.show{opacity:1;transform:scale(1);}
  #heart-btn{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#e8186d,#f06090);
    display:flex;align-items:center;justify-content:center;font-size:1.8rem;
    box-shadow:0 0 0 4px #e8186d0a;transition:all .9s ease;cursor:pointer;border:none;}
  #heart-btn.pulse{box-shadow:0 0 0 16px #e8186d1a;transform:scale(1.14);}

  /* ── TIMELINE ── */
  #timeline-section{min-height:100vh;padding:64px 16px 32px;}
  .tl-wrap{position:relative;max-width:400px;margin:0 auto;}
  .tl-line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,#e8186d,#f06090);transform:translateX(-50%);}
  .tl-item{display:flex;padding-bottom:28px;position:relative;}
  .tl-item.left{justify-content:flex-start;padding-right:50%;}
  .tl-item.right{justify-content:flex-end;padding-left:50%;}
  .tl-dot{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:#e8186d;z-index:2;box-shadow:0 0 0 4px #fdd6e8;}
  .tl-card{background:white;border-radius:16px;padding:14px 16px;max-width:90%;box-shadow:0 4px 16px #e8186d0e;opacity:0;transition:all .6s ease;}
  .tl-card.left-enter{transform:translateX(-30px);}
  .tl-card.right-enter{transform:translateX(30px);}
  .tl-card.visible{opacity:1;transform:translateX(0)!important;}
  .tl-year{font-weight:800;color:#e8186d;font-size:1.1rem;margin-bottom:6px;}
  .tl-text{color:#666;font-size:.87rem;line-height:1.55;}

  /* ── CROWN ── */
  #girl-group{transition:transform 2s cubic-bezier(.4,0,.2,1);}
  #crown-on-mom{opacity:0;transition:opacity .4s ease .2s;}
  #crown-on-mom.show{opacity:1;}
  #crown-in-hand{transition:transform 2s cubic-bezier(.4,0,.2,1),opacity .3s ease;}
  #girl-arm{transition:all 2s ease;}

  /* ── WOW ── */
  #flip-box{perspective:800px;cursor:pointer;margin-bottom:24px;}
  #flip-inner{display:inline-block;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,0,.2,1);width:100%;height:96px;}
  #flip-inner.flipped{transform:rotateX(180deg);}
  .flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:5.5rem;color:#e8186d;}
  #flip-front{transform:rotateX(180deg);}
  #flip-back{}
  #wow-mom-text{display:none;}

  /* ── CANDLE ── */
  @keyframes flicker{0%,100%{transform:translate(1.5px,-2px)}50%{transform:translate(-1.5px,0)}}
  #flame-group{animation:flicker .13s ease infinite;display:none;}
  #flame-group.lit{display:block;}
  #glow-ring{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#ffee0055 0%,transparent 70%);filter:blur(8px);display:none;}
  #glow-ring.lit{display:block;}
  #candle-wrap{position:relative;display:inline-block;}

  /* ── LETTER ── */
  #envelope-wrap{cursor:pointer;filter:drop-shadow(0 10px 28px #e8186d33);}
  #env-flap{transform-origin:130px 40px;transition:transform .7s ease;}
  #env-flap.open{transform:rotateX(180deg);}
  #env-seal{transition:opacity .3s ease;}
  #letter-content{display:none;width:100%;max-width:400px;}
  #letter-content.show{display:block;animation:letterUp .8s cubic-bezier(.22,1,.36,1) both;}
  @keyframes letterUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
  .letter-stripe{position:absolute;top:0;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#e8186d 0,#e8186d 20px,#f06090 20px,#f06090 40px,#fdd6e8 40px,#fdd6e8 60px);}
  .letter-body{color:#444;font-size:.9rem;line-height:1.9;font-family:Georgia,serif;}

  /* ── FINAL ── */
  @keyframes floatHeart{from{transform:translateY(0) scale(1);opacity:1}to{transform:translateY(-92vh) scale(.4);opacity:0}}
  .floating-heart{position:fixed;bottom:8%;font-size:1.4rem;animation:floatHeart 3.5s ease-out forwards;pointer-events:none;}

  /* ── PULSE animation ── */
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="dots"></div>
<div id="app"></div>

<script>
// ══════════════════════════════
// STATE
// ══════════════════════════════
const SCREENS = ['landing','rainbow','memory','whatyoumean','timeline','crown','wow','candle','letter','final'];
let currentScreen = 0;

// ══════════════════════════════
// NAVIGATION
// ══════════════════════════════
function renderDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = SCREENS.map((_, i) =>
    `<div class="dot ${i === currentScreen ? 'active' : 'inactive'}"></div>`
  ).join('');
}

function goNext() {
  currentScreen = Math.min(currentScreen + 1, SCREENS.length - 1);
  renderDots();
  renderScreen();
}

function renderScreen() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'screen';
  app.appendChild(div);
  screens[currentScreen](div);
}

// ══════════════════════════════
// LANDING
// ══════════════════════════════
function screenLanding(el) {
  el.innerHTML = `
  <div class="center" id="screen-landing">
    <div class="fade" id="l1">
      <h1 class="grad-text">Hey Mamma 💖</h1>
    </div>
    <div class="fade" id="l2" style="margin-bottom:8px">
      <svg id="landing-cat" width="140" height="158" viewBox="0 0 140 158">
        <ellipse cx="70" cy="102" rx="40" ry="44" fill="white" stroke="#f5d0e0" stroke-width="1.5"/>
        <circle cx="70" cy="58" r="32" fill="white" stroke="#f5d0e0" stroke-width="1.5"/>
        <ellipse cx="70" cy="27" rx="6" ry="11" fill="#6db33f" transform="rotate(-8,70,27)"/>
        <ellipse cx="73" cy="26" rx="4" ry="7" fill="#90d050" transform="rotate(-8,73,26)"/>
        <circle cx="60" cy="55" r="4" fill="#222"/><circle cx="80" cy="55" r="4" fill="#222"/>
        <circle cx="61.5" cy="53" r="1.3" fill="white"/><circle cx="81.5" cy="53" r="1.3" fill="white"/>
        <ellipse cx="53" cy="62" rx="5.5" ry="3" fill="#ffb3cc" opacity=".6"/>
        <ellipse cx="87" cy="62" rx="5.5" ry="3" fill="#ffb3cc" opacity=".6"/>
        <path d="M63 65 Q70 72 77 65" stroke="#e8186d" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="30" cy="107" rx="9" ry="20" fill="white" stroke="#f5d0e0" stroke-width="1.5" transform="rotate(14,30,107)"/>
        <ellipse cx="110" cy="107" rx="9" ry="20" fill="white" stroke="#f5d0e0" stroke-width="1.5" transform="rotate(-14,110,107)"/>
        <ellipse cx="55" cy="142" rx="10" ry="7" fill="white" stroke="#f5d0e0" stroke-width="1.5"/>
        <ellipse cx="85" cy="142" rx="10" ry="7" fill="white" stroke="#f5d0e0" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="fade" id="l3">
      <p id="landing-p">There is something for you ✨</p>
      <button class="btn" onclick="goNext()">Open 💌</button>
    </div>
  </div>`;

  setTimeout(() => document.getElementById('l1').classList.add('show'), 100);
  setTimeout(() => document.getElementById('l2').classList.add('show'), 350);
  setTimeout(() => document.getElementById('l3').classList.add('show'), 600);

  // bounce cat
  let b = false;
  const cat = document.getElementById('landing-cat');
  setInterval(() => {
    b = !b;
    cat.style.transform = b ? 'translateY(-7px)' : 'translateY(0)';
  }, 1400);
}

// ══════════════════════════════
// RAINBOW
// ══════════════════════════════
function screenRainbow(el) {
  const arcs = [
    {r:88,c:"#6a0dad"},{r:75,c:"#4a90d9"},{r:62,c:"#50c060"},
    {r:49,c:"#f0d030"},{r:36,c:"#f08020"},{r:23,c:"#e83040"}
  ];

  const arcPaths = arcs.map(({r,c},i) => {
    const len = Math.PI * r;
    return `<path d="M ${105-r} 105 A ${r} ${r} 0 0 1 ${105+r} 105" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${len}" stroke-dashoffset="${len}"
      style="animation:arcDraw${i} .55s ease both;animation-delay:${i*.2}s;animation-fill-mode:backwards;"
      id="arc${i}"/>`;
  }).join('');

  const styleAnims = arcs.map(({r},i) => {
    const len = Math.PI*r;
    return `@keyframes arcDraw${i}{from{stroke-dashoffset:${len}}to{stroke-dashoffset:0}}`;
  }).join('');

  el.innerHTML = `
  <style>${styleAnims}</style>
  <div class="center">
    <div class="card">
      <svg width="210" height="115" viewBox="0 0 210 115" style="overflow:visible;display:block;margin:0 auto;">${arcPaths}</svg>
      <div id="rainbow-text" style="opacity:0;transform:translateY(14px);transition:all .7s ease;margin-top:22px;">
        <p style="font-size:1.1rem;font-weight:700;color:#555;line-height:1.6;">You are rainbow in my clouds 🌈</p>
        <div style="margin-top:22px;"><button class="btn" onclick="goNext()">Continue 💖</button></div>
      </div>
    </div>
  </div>`;

  setTimeout(() => {
    const t = document.getElementById('rainbow-text');
    t.style.opacity = '1'; t.style.transform = 'translateY(0)';
  }, 2200);
}

// ══════════════════════════════
// MEMORY
// ══════════════════════════════
function screenMemory(el) {
  el.innerHTML = `
  <div class="center">
    <div style="position:relative;width:100%;max-width:340px;">
      <div class="fade" id="m1">
        <div class="mem-emoji" style="background:#fdd6e8;">
  <img src="photo1.jpeg" style="width:100%;height:160px;object-fit:cover;"/>
</div>
      </div>
      <svg width="100%" height="90" viewBox="0 0 320 90" style="display:block;margin:-8px 0;">
        <path id="mem-line" d="M 115 8 C 115 45, 210 45, 210 82" fill="none" stroke="#e8186d" stroke-width="2.5"/>
      </svg>
      <div class="fade" id="m2">
        <div class="mem-photo" style="width:62%;margin-left:auto;">
          <div class="mem-emoji" style="background:#fdd6e8;">
  <img src="photo2.jpg" style="width:100%;height:160px;object-fit:cover;"/>
</div>
      </div>
      <div id="mem-cap" style="opacity:0;transform:translateY(12px);transition:all .7s ease;text-align:center;margin-top:24px;">
        <p style="color:#888;font-size:1rem;line-height:1.8;">From holding your finger…<br/>to holding your values forever 💞</p>
        <div style="margin-top:22px;"><button class="btn" onclick="goNext()">Continue 💖</button></div>
      </div>
    </div>
  </div>`;

  setTimeout(() => document.getElementById('m1').classList.add('show'), 200);
  setTimeout(() => document.getElementById('mem-line').classList.add('drawn'), 500);
  setTimeout(() => document.getElementById('m2').classList.add('show'), 700);
  setTimeout(() => {
    const c = document.getElementById('mem-cap');
    c.style.opacity = '1'; c.style.transform = 'translateY(0)';
  }, 1300);
}

// ══════════════════════════════
// WHAT YOU MEAN
// ══════════════════════════════
function screenWhatYouMean(el) {
  const TAGS = [
    {label:"Strong",   top:"4%",   left:"2%"},
    {label:"Selfless", top:"4%",   right:"2%"},
    {label:"Brave",top:"40%",  left:"0%"},
    {label:"Beautiful",top:"40%",  right:"0%"},
    {label:"My Safe Place",bottom:"12%",left:"2%"},
    {label:"Biggest Supporter",  bottom:"12%",right:"2%"},
  ];

  const tagsHtml = TAGS.map((tag, i) => {
    const {label, ...pos} = tag;
    const style = Object.entries(pos).map(([k,v])=>`${k}:${v}`).join(';');
    return `<div class="tag-chip" id="tag${i}" style="${style}">${label}</div>`;
  }).join('');

  el.innerHTML = `
  <div id="whatyoumean-section">
    <div class="center" style="padding-top:40px;">
      <div class="fade show" style="margin-bottom:24px;">
        <h2 style="font-size:1.5rem;font-weight:800;" class="grad-text">What You Mean To Me 💖</h2>
      </div>
      <div style="position:relative;width:290px;height:310px;">
        <div id="center-avatar" title="Tap me!">👩</div>
        ${tagsHtml}
      </div>
      <div style="margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:16px;">
        <button id="heart-btn">❤️</button>
        <div id="next-btn-wrap" style="display:none;"><button class="btn" onclick="goNext()">Next 💫</button></div>
      </div>
      <p style="color:#bbb;font-size:.82rem;margin-top:10px;" id="heart-hint">Tap the heart to reveal ✨</p>
    </div>
  </div>`;

  // pulse heart
  let big = false;
  const heartBtn = document.getElementById('heart-btn');
  const iv = setInterval(() => {
    big = !big;
    heartBtn.classList.toggle('pulse', big);
  }, 900);

  let tagsRevealed = false;
  heartBtn.addEventListener('click', () => {
    if (tagsRevealed) return;
    tagsRevealed = true;
    clearInterval(iv);
    document.getElementById('heart-hint').style.display = 'none';
    TAGS.forEach((_, i) => {
      setTimeout(() => document.getElementById(`tag${i}`).classList.add('show'), i * 300);
    });
    setTimeout(() => {
      document.getElementById('next-btn-wrap').style.display = 'block';
    }, TAGS.length * 300 + 400);
  });
}

// ══════════════════════════════
// TIMELINE
// ══════════════════════════════
function screenTimeline(el) {
  const TL = [
    {y:"2006", t:"You welcomed me into the world with open arms and endless love 👶💕", s:"left"},
    {y:"2009", t:"My first school days — your smile made every goodbye easier 🎒", s:"right"},
    {y:"2013", t:"You held my hand through every doubt and wiped every tear 💖", s:"left"},
    {y:"2015", t:"School mornings, your love packed in every lunchbox 🍱", s:"right"},
    {y:"2018", t:"Late nights of study, you stayed awake with me ☕✨", s:"left"},
    {y:"2020", t:"Through tough times, you were my rock and my peace 🏡", s:"right"},
    {y:"2022", t:"Celebrating small wins together, making memories ✨", s:"left"},
    {y:"2026", t:"Still growing, still learning — always your child ❤️", s:"right"},
    {y:"Today", t:"Thank you, Mamma. For everything. Forever. 💝", s:"left"},
  ];

  const itemsHtml = TL.map((item, i) => `
    <div class="tl-item ${item.s}" data-side="${item.s}">
      <div class="tl-dot"></div>
      <div class="tl-card ${item.s}-enter" id="tlcard${i}">
        <div class="tl-year">${item.y}</div>
        <div class="tl-text">${item.t}</div>
      </div>
    </div>`).join('');

  el.innerHTML = `
  <div id="timeline-section">
    <div class="fade show" style="text-align:center;margin-bottom:32px;">
      <h2 style="font-size:1.6rem;font-weight:800;" class="grad-text">Our Journey Together 💝</h2>
      <p style="color:#bbb;font-size:.82rem;margin-top:4px;">Every moment with you is a memory I cherish forever</p>
    </div>
    <div class="tl-wrap">
      <div class="tl-line"></div>
      ${itemsHtml}
    </div>
    <div style="text-align:center;padding:12px 0 40px;"><button class="btn" onclick="goNext()">Continue 💌</button></div>
  </div>`;

  // Intersection observer for cards
  const cards = el.querySelectorAll('.tl-card');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
  }, {threshold:.3});
  cards.forEach(c => obs.observe(c));
}

// ══════════════════════════════
// CROWN
// ══════════════════════════════
function screenCrown(el) {
  el.innerHTML = `
  <div class="center">
    <div class="card" style="padding:24px 20px 30px;">
      <h2 style="font-size:1.4rem;font-weight:800;color:#e8186d;line-height:1.4;margin-bottom:16px;">You are the Best Mom<br/>in the World 💝</h2>
      <svg width="280" height="290" viewBox="0 0 280 290" style="display:block;margin:0 auto;overflow:visible;">
        <!-- LADDER -->
        <rect x="68" y="48" width="8" height="210" rx="4" fill="#a0522d"/>
        <rect x="108" y="48" width="8" height="210" rx="4" fill="#a0522d"/>
        ${[58,76,94,112,130,148,166,184,202,220,238].map(y=>`<rect x="68" y="${y}" width="48" height="7" rx="3.5" fill="#c8762e"/>`).join('')}
        <ellipse cx="72" cy="260" rx="7" ry="4" fill="#6B3A1A" opacity=".5"/>
        <ellipse cx="112" cy="260" rx="7" ry="4" fill="#6B3A1A" opacity=".5"/>
        <!-- MOM -->
        <g transform="translate(148,32)">
          <ellipse cx="47" cy="26" rx="25" ry="27" fill="#0d0500"/>
          <rect x="62" y="30" width="12" height="55" rx="6" fill="#0d0500"/>
          <circle cx="47" cy="37" r="22" fill="#f2c090"/>
          <circle cx="47" cy="21" r="2.5" fill="#e8186d"/>
          <ellipse cx="38" cy="37" rx="4" ry="4.5" fill="#1a0500"/>
          <ellipse cx="56" cy="37" rx="4" ry="4.5" fill="#1a0500"/>
          <circle cx="39" cy="35.5" r="1.4" fill="white"/><circle cx="57" cy="35.5" r="1.4" fill="white"/>

function startClimb() {
  document.getElementById('climb-btn').style.display = 'none';
  document.getElementById('climbing-msg').style.display = 'block';

  document.getElementById('girl-arm').setAttribute('x2','125');
  document.getElementById('girl-arm').setAttribute('y2','158');
  document.getElementById('crown-in-hand').style.transform = 'translate(112px,-10px)';

  setTimeout(() => {
    // show crown on mom, hide crown in hand
    document.getElementById('crown-on-mom').classList.add('show');
    document.getElementById('crown-in-hand').style.opacity = '0';
    document.getElementById('climbing-msg').style.display = 'none';
    document.getElementById('crowned-msg').style.display = 'block';
  }, 2000);
}
